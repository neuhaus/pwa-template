<!doctype html>
<html lang="en">
  <head>
    <%~ include('partials/head-meta', it) %>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <h1><%= it.appName %></h1>
        <span id="network-status" class="badge" aria-live="polite">Checking…</span>
      </header>

      <p class="subtitle"><%= it.description %></p>

      <%~ include('partials/ios-install', it) %>

      <section class="card" aria-labelledby="sw-heading">
        <h2 id="sw-heading">Offline &amp; Service Worker</h2>
        <p id="sw-status" class="status-text" aria-live="polite">Registering service worker…</p>
      </section>

      <section class="card" aria-labelledby="push-heading">
        <h2 id="push-heading">Push Notifications</h2>
        <p id="push-status" class="status-text" aria-live="polite">Checking push support…</p>

        <label class="field" for="vapid-key">
          <span>VAPID Public Key (Base64URL)</span>
          <input
            id="vapid-key"
            type="text"
            placeholder="Paste your server VAPID public key"
            autocomplete="off"
            spellcheck="false"
          />
        </label>

        <div class="actions">
          <button id="push-subscribe-btn" type="button">Enable Push</button>
          <button id="push-unsubscribe-btn" type="button" class="secondary" hidden>
            Disable Push
          </button>
          <button id="test-notification-btn" type="button" class="secondary">
            Test Local Notification
          </button>
        </div>

        <pre id="push-subscription-output" class="code-box" hidden></pre>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
