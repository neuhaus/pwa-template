name: Security & CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Check for newly disclosed upstream CVEs every Monday at 09:00 UTC
    - cron: '0 9 * * 1'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:cve

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright-core install chromium --with-deps
      - run: npm run build
      - run: npm run test:e2e
